<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Page not found | MyPDFBuilder</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #0f172a; background: #f8fafc; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 36rem; text-align: center; }
      h1 { margin: 0 0 12px; font-size: clamp(2rem, 8vw, 3rem); }
      p { color: #475569; line-height: 1.6; }
      a { display: inline-block; margin-top: 12px; border-radius: 12px; padding: 12px 18px; color: #fff; background: #4f46e5; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #818cf8; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>That page doesn’t exist. Return to MyPDFBuilder to choose one of the available PDF tools.</p>
      <a href="/">Go to MyPDFBuilder</a>

  </body>
